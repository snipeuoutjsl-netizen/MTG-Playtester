# Publishes the update release by itself, so no file can be forgotten.
# Automatic: when a change to app/package.json (the version number) lands on main, e.g. by merging a pull request, a release v<version> is created if it does not exist yet.
# Manual: push a tag named v<version>, or open Actions > "Publish release" > Run workflow (optionally type a tag).
# It checks that app.js is built from the source, builds the six update files with developer/make-release.js and creates a published (not draft) release.
name: Publish release

on:
  push:
    branches: [main]
    paths: ['app/package.json']
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, for example v0.96.14 (leave empty to use the version in app/package.json)'
        required: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Work out the version and tag
        run: |
          VER=$(node -p "require('./app/package.json').version")
          TAG="${{ github.event.inputs.tag }}"
          if [ -z "$TAG" ] && [ "${{ github.ref_type }}" = "tag" ]; then TAG="${{ github.ref_name }}"; fi
          [ -n "$TAG" ] || TAG="v$VER"
          [ "v$VER" = "$TAG" ] || { echo "Tag $TAG does not match app version v$VER. Change the tag or the version."; exit 1; }
          echo "VER=$VER" >> "$GITHUB_ENV"; echo "TAG=$TAG" >> "$GITHUB_ENV"
          if gh release view "$TAG" >/dev/null 2>&1; then echo "Release $TAG already exists: nothing to do."; echo "SKIP=1" >> "$GITHUB_ENV"; fi
      - name: Check app.js is built from src
        if: env.SKIP != '1'
        run: node developer/build-src.js --check
      - name: Build the six update files
        if: env.SKIP != '1'
        run: node developer/make-release.js
      - name: Create the release
        if: env.SKIP != '1'
        run: |
          for f in index.html app.js style.css package.json latest.json update.json; do [ -s "release-$VER/$f" ] || { echo "missing $f"; exit 1; }; done
          node -e "const m=require('./release-$VER/latest.json');console.log('**'+m.title+'**\n\n'+m.notes.map(n=>'- '+n).join('\n'))" > notes.md
          gh release create "$TAG" release-$VER/index.html release-$VER/app.js release-$VER/style.css release-$VER/package.json release-$VER/latest.json release-$VER/update.json \
            --title "v$VER" --notes-file notes.md --target "${{ github.sha }}" --latest
