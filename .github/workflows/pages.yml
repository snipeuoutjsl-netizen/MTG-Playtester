# Publishes the web app (phones, tablets, any browser) to GitHub Pages whenever the app changes on main.
name: Web app (GitHub Pages)
on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect the web files
        run: |
          mkdir site
          cp app/index.html app/app.js app/style.css app/manifest.webmanifest app/sw.js site/
          cp -r app/icons site/icons
          node -e "console.log(JSON.stringify({v:require('./app/package.json').version}))" > site/version.json
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  # a separate job, so the uploaded artifact is fully registered before the deployment looks for it
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.dep.outputs.page_url }}' }
    steps:
      - id: dep
        uses: actions/deploy-pages@v4
